
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <div class="task-input">

            <div class="task-entry">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                >

                <button id="addTaskBtn">Add Task</button>
            </div>

            <!-- Task Priority -->
            <div class="priority-input">
                <label for="taskPriority">Task Priority:</label>

                <select id="taskPriority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
            </div>

            <!-- Due Date -->
            <div class="date-input">
                <label for="taskDate">Due date (optional)</label>
                <input type="datetime-local" id="taskDate">
            </div>

        </div>

        <p id="errorMessage"></p>

        <div class="task-summary">
            <span>Total Tasks: <strong id="totalTasks">0</strong></span>
            <span>Completed: <strong id="completedTasks">0</strong></span>
        </div>

        <!-- Task Progress -->
        <div class="progress-section">
            <div class="progress-heading">
                <span>Task Progress</span>
                <strong id="progressPercentage">0%</strong>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <p id="progressText">0 of 0 tasks completed</p>
        </div>

        <!-- Task Filters -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

        <button id="clearCompletedBtn">Clear Completed</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
